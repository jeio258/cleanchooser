name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install platform 37 and build tools
        run: |
          set -o pipefail
          sdkmanager --list --channel=3 > sdk-packages.log 2>&1
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools" 2>&1 | tee sdk-install.log
          ls "${ANDROID_HOME}/platforms"
          ls "${ANDROID_HOME}/build-tools/37.0.0/aapt2"

      - name: Check localizations
        run: |
          python3 tools/check-source-localization.py
          python3 tools/check-translation-resources.py
          python3 tools/check-bilingual-parity.py

      - name: Unit tests
        run: ./gradlew --no-daemon --console=plain :app:testDebugUnitTest

      - name: Build APK
        run: ./gradlew --no-daemon --console=plain :app:assembleClean

      - name: Verify APK
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          "${ANDROID_HOME}/build-tools/37.0.0/aapt2" dump badging "$APK" | head -n 5
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --print-certs "$APK" > /dev/null
          SIZE=$(stat -c%s "$APK")
          echo "APK size: $((SIZE / 1024 / 1024)) MB"
          mkdir -p artifacts
          cp "$APK" artifacts/CleanChooser-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CleanChooser-debug
          path: artifacts/CleanChooser-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            sdk-install.log
          if-no-files-found: ignore
          retention-days: 7
