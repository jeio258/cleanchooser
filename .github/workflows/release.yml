name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed APK and publish release
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false

      - name: Install platform 37 and build tools
        run: |
          sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0" "platform-tools"

      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64}" ]; then
            echo "RELEASE_STORE_BASE64 is not configured" >&2
            exit 1
          fi
          printf '%s' "${KEYSTORE_BASE64}" | base64 -d > release.jks
          test -s release.jks

      - name: Build release APK
        env:
          RELEASE_STORE_FILE: release.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew --no-daemon --console=plain :app:assembleRelease

      - name: Collect artifact
        run: |
          set -euo pipefail
          VERSION="$(grep -m1 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')"
          test -n "$VERSION"
          mkdir -p artifacts
          cp app/build/outputs/apk/release/app-release.apk "artifacts/CleanChooser-${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          sha256sum "artifacts/CleanChooser-${VERSION}.apk"

      - name: Verify signature
        run: |
          "${ANDROID_HOME}/build-tools/37.0.0/apksigner" verify --print-certs \
            "artifacts/CleanChooser-${VERSION}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: CleanChooser ${{ env.VERSION }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: artifacts/CleanChooser-${{ env.VERSION }}.apk
          generate_release_notes: true
